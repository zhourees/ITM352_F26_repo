<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        a {
            text-align: center;
            text-decoration: none;
            color: black;
            background-image: linear-gradient(to top, #f8f4ff, #f2dbff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: normal;
            font-size: 20px;
            position: fixed;
            left: 680px;
            bottom: 230px;
            margin: 8px;
            padding: 8px;
            border-style: solid;
            border-width: 3px;
            border-color: black;
}
        body {
            margin: 0;
            height: 100vh;
            display: grid;
            place-items: center;
            background-image: url(https://cdn.wallpapersafari.com/53/15/XdCHGyw.webp);
            background-size: cover;
}
        h1 {
            text-align: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: normal;
            font-size: 48px;
            margin: auto;
            background-color: white;
            border-style: solid;
            border-width: 3px;
            border-bottom: 0px;
            padding: 8px;
}

        p {
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
            font-size: 32px;
            margin: auto;
            width: fit-content;
            background-color: white;
            padding: 10px;
            border-style: solid;
            border-width: 3px;
            border-top: 0px;
}
    </style>
    <title>Quiz Result</title>
</head>
<body>
    <div>
    <h1>Quiz Result</h1>
    <p>Your score: {{ score }} out of {{ maxQuestions }}
    <br>---------------------------------------
    <br>Your high score in normal mode: {{ highScore }} out of {{ maxQuestions }}
    <br>Your high score in timed mode: {{ highScoreTimed }} out of {{ maxQuestions }}
    </p>
    <a href="{{ url_for('index') }}">Take Quiz Again</a>
    </div>
</body>
</html>
